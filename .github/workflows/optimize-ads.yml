name: Optimize ad images

# Whenever an image is added or changed in ads/, convert it to a 1200x400 WebP
# under 100 KB, update ads.json to match, and commit the result.
on:
  push:
    branches: [main]
    paths:
      - 'ads/**'
      - 'ads.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: optimize-ads
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet "Pillow>=10"

      - name: Convert images
        run: python3 tools/optimize_ads.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ads ads.json tools/optimized.json
          git commit -m "Optimize ad images (1200x400 WebP)"
          git push

      - name: Republish the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
